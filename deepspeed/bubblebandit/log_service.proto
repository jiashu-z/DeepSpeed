syntax = "proto3";

service LogServer {
  // Write log entry.
  rpc WriteLog (LogEntry) returns (Empty) {}

  rpc DumpSched (DumpSchedEntry) returns (Empty) {}

  rpc DumpStepSched (DumpStepSchedEntry) returns (Empty) {}

  rpc RecordInstr (RecordInstrEntry) returns (Empty) {}

  rpc Clear(Empty) returns (Empty) {}

  rpc GrantBubble(GrantBubbleArgs) returns (GrantBubbleReply) {}

  rpc KillBubble(KillBubbleArgs) returns (KillBubbleReply) {}
}

message LogEntry {
  int64 pid = 1;
  int64 ts = 2;
  string msg = 3;
}

message Empty {

}

message DumpSchedEntry {
  int64 pid = 1;
  int64 ts = 2;
  string msg = 3;
}

message DumpStepSchedEntry {
  int64 pid = 1;
  int64 ts0 = 2;
  int64 ts1 = 3;
  string msg = 4;
}

message RecordInstrEntry {
  int64 pid = 1;
  int64 ts0 = 2;
  int64 ts1 = 3;
  string instr = 4;
}

message GrantBubbleArgs {
  double start = 1;
  double end = 2;
  int64 stage_id = 3;
  string device = 4;
}

message GrantBubbleReply {

}

message KillBubbleArgs {
  double start = 1;
  double end = 2;
  int64 stage_id = 3;
  string device = 4;
}

message KillBubbleReply {

}